name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest nbqa

      - name: Run Ruff (lint)
        run: |
          ruff check . --exclude 04_projetos

      - name: Run Black (format check)
        run: |
          black --check .

      - name: Run tests (pytest)
        run: |
          pytest -q

      - name: Validate notebooks
        run: ruff check . --exclude 04_projetos

      - name: Run Black (format check)
        run: |
          black --check . --exclude 04_projetos
